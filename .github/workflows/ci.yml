name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r docker/requirements.txt
          pip install flake8 pytest httpx

      - name: Lint
        run: flake8 .

      - name: Tests
        run: pytest tests/ -v
